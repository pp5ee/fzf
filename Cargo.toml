[package]
name = "fzf"
version = "0.72.0"
edition = "2021"
authors = ["Junegunn Choi <junegunn.c@gmail.com>"]
description = "A command-line fuzzy finder"
license = "MIT"
repository = "https://github.com/junegunn/fzf"
keywords = ["fuzzy", "finder", "cli", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
regex = "1.11"
unicode-segmentation = "1.12"
unicode-width = "0.1"
walkdir = "2.5"
shlex = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
once_cell = "1.20"
arc-swap = "1.7"
crossbeam = "0.8"
parking_lot = "0.12"
bitflags = "2.6"
dirs = "5.0"
tempfile = "3.13"
num_cpus = "1.16"
rayon = "1.10"

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
